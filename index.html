<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 발표 순서 정하기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --border: #d8ded2;
      --primary: #256f5b;
      --primary-dark: #1c5747;
      --accent: #e8b94f;
      --danger: #b44747;
      --shadow: 0 18px 45px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(37, 111, 91, 0.10), transparent 34%),
        linear-gradient(315deg, rgba(232, 185, 79, 0.14), transparent 35%),
        var(--bg);
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0;
    }

    .app-header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.75rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 640px;
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 430px);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .input-panel,
    .result-panel {
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    textarea {
      width: 100%;
      min-height: 330px;
      resize: vertical;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      line-height: 1.55;
      background: #fbfcfa;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 111, 91, 0.14);
    }

    .hint {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease, color 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      background: var(--primary);
      color: #ffffff;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #edf2ea;
      color: var(--primary-dark);
    }

    .secondary:hover {
      background: #dfe8db;
    }

    .ghost {
      background: transparent;
      color: var(--danger);
      border: 1px solid #efcaca;
    }

    .ghost:hover {
      background: #fff1f1;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    .count {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(232, 185, 79, 0.22);
      color: #715310;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .message {
      min-height: 24px;
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .message.error {
      color: var(--danger);
      font-weight: 700;
    }

    ol {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      min-height: 54px;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfa;
    }

    .rank {
      display: grid;
      place-items: center;
      height: 100%;
      border-right: 1px solid var(--border);
      color: var(--primary-dark);
      font-weight: 800;
    }

    .name {
      padding: 12px 14px;
      font-weight: 700;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 250px;
      padding: 20px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      background: #fbfcfa;
    }

    @media (max-width: 840px) {
      main {
        width: min(100% - 24px, 680px);
        padding: 28px 0;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 240px;
      }
    }

    @media (max-width: 520px) {
      .input-panel,
      .result-panel {
        padding: 16px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <h1>랜덤 발표 순서 정하기</h1>
      <p class="subtitle">학생 이름을 입력하고 버튼을 누르면 발표 순서를 무작위로 정해줍니다.</p>
    </header>

    <section class="workspace" aria-label="발표 순서 생성기">
      <div class="panel input-panel">
        <label for="studentNames">학생 이름</label>
        <textarea id="studentNames" placeholder="예:&#10;김민준&#10;이서연&#10;박지호&#10;최하은"></textarea>
        <p class="hint">한 줄에 한 명씩 입력하거나 쉼표로 구분해도 됩니다.</p>
        <div class="actions">
          <button class="primary" id="shuffleButton" type="button">발표 순서 뽑기</button>
          <button class="secondary" id="sampleButton" type="button">예시 입력</button>
          <button class="ghost" id="clearButton" type="button">초기화</button>
        </div>
      </div>

      <div class="panel result-panel">
        <div class="result-header">
          <h2>발표 순서</h2>
          <span class="count" id="studentCount">0명</span>
        </div>
        <p class="message" id="message">이름을 입력한 뒤 발표 순서를 뽑아보세요.</p>
        <div id="resultArea" class="empty-state">아직 정해진 발표 순서가 없습니다.</div>
      </div>
    </section>
  </main>

  <script>
    const studentNames = document.querySelector("#studentNames");
    const shuffleButton = document.querySelector("#shuffleButton");
    const sampleButton = document.querySelector("#sampleButton");
    const clearButton = document.querySelector("#clearButton");
    const studentCount = document.querySelector("#studentCount");
    const message = document.querySelector("#message");
    const resultArea = document.querySelector("#resultArea");

    const sampleNames = [
      "김민준",
      "이서연",
      "박지호",
      "최하은",
      "정도윤",
      "강지민",
      "윤서아",
      "한유준"
    ];

    function parseNames(value) {
      return value
        .split(/[\n,]+/)
        .map((name) => name.trim())
        .filter(Boolean);
    }

    function shuffle(items) {
      const copied = [...items];

      for (let index = copied.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copied[index], copied[randomIndex]] = [copied[randomIndex], copied[index]];
      }

      return copied;
    }

    function updateCount() {
      const names = parseNames(studentNames.value);
      studentCount.textContent = `${names.length}명`;
    }

    function renderEmpty(text) {
      resultArea.className = "empty-state";
      resultArea.textContent = text;
    }

    function renderOrder(names) {
      const list = document.createElement("ol");

      names.forEach((name, index) => {
        const item = document.createElement("li");
        const rank = document.createElement("span");
        const nameText = document.createElement("span");

        rank.className = "rank";
        rank.textContent = `${index + 1}`;
        nameText.className = "name";
        nameText.textContent = name;

        item.append(rank, nameText);
        list.append(item);
      });

      resultArea.className = "";
      resultArea.replaceChildren(list);
    }

    function drawPresentationOrder() {
      const names = parseNames(studentNames.value);
      updateCount();

      if (names.length === 0) {
        message.textContent = "발표 순서를 정하려면 학생 이름을 1명 이상 입력하세요.";
        message.className = "message error";
        renderEmpty("입력된 이름이 없습니다.");
        studentNames.focus();
        return;
      }

      const orderedNames = shuffle(names);
      message.textContent = `총 ${orderedNames.length}명의 발표 순서가 정해졌습니다.`;
      message.className = "message";
      renderOrder(orderedNames);
    }

    shuffleButton.addEventListener("click", drawPresentationOrder);

    sampleButton.addEventListener("click", () => {
      studentNames.value = sampleNames.join("\n");
      updateCount();
      message.textContent = "예시 이름을 넣었습니다. 발표 순서를 뽑아보세요.";
      message.className = "message";
      renderEmpty("아직 정해진 발표 순서가 없습니다.");
      studentNames.focus();
    });

    clearButton.addEventListener("click", () => {
      studentNames.value = "";
      updateCount();
      message.textContent = "이름을 입력한 뒤 발표 순서를 뽑아보세요.";
      message.className = "message";
      renderEmpty("아직 정해진 발표 순서가 없습니다.");
      studentNames.focus();
    });

    studentNames.addEventListener("input", updateCount);
  </script>
</body>
</html>
