<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 및 학급 명단 | 권쌤의 교실</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --soft-bg: #f4f8fc;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d9e4ef;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --primary-soft: #eaf2ff;
      --danger: #b44747;
      --shadow: 0 16px 40px rgba(37, 99, 235, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    main {
      width: min(680px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .back-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      color: var(--primary-dark);
      font-weight: 800;
    }

    .back-link:hover,
    .back-link:focus-visible { text-decoration: underline; }

    header { margin: 38px 0 28px; }

    h1 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: clamp(2rem, 6vw, 3.1rem);
      line-height: 1.15;
    }

    .intro, .hint, .message { color: var(--muted); line-height: 1.65; }
    .intro { margin: 0; }

    .panel {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    h2 { margin: 0 0 12px; font-size: 1.3rem; }
    p { margin: 0; }

    .status-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 700;
      line-height: 1.5;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      margin-top: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    form { display: grid; gap: 14px; }
    label { font-weight: 800; }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #fbfdff;
      font: inherit;
      outline: none;
    }

    input:focus, button:focus-visible, .back-link:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
    }

    input[aria-invalid="true"] { border-color: var(--danger); }
    .hint { font-size: 0.95rem; }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      color: #ffffff;
      background: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: var(--primary-dark); }
    button:disabled { cursor: not-allowed; opacity: 0.65; }
    .secondary { color: var(--primary-dark); background: var(--primary-soft); }
    .secondary:hover { background: #d8e8ff; }

    .message { min-height: 26px; margin-top: 18px; }
    .message.error { color: var(--danger); font-weight: 800; }
    .logged-in-email { margin: 8px 0 20px; overflow-wrap: anywhere; color: var(--primary-dark); font-weight: 800; }
    .privacy-note { margin-top: 22px; font-size: 0.92rem; }

    [hidden] { display: none !important; }

    @media (max-width: 540px) {
      main { width: min(100% - 24px, 680px); padding-top: 20px; }
      header { margin: 28px 0 24px; }
      .panel { padding: 18px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../">← 권쌤의 교실로 돌아가기</a>
    <header>
      <h1>계정 및 학급 명단</h1>
      <p class="intro">로그인하면 여러 기기에서 같은 학급 명단을 사용할 수 있습니다.</p>
    </header>

    <section class="panel" aria-labelledby="accountTitle">
      <div class="status-box" id="checkingPanel" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>로그인 상태를 확인하고 있습니다.</span>
      </div>

      <div id="signedOutPanel" hidden>
        <h2 id="accountTitle">로그인이 필요합니다</h2>
        <p class="hint">비밀번호 없이 이메일로 받은 로그인 링크를 열어 로그인할 수 있습니다.</p>
        <form id="magicLinkForm" novalidate>
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" aria-describedby="emailHint emailError" aria-invalid="false" required>
          <p class="hint" id="emailHint">로그인 링크를 받은 뒤 같은 기기와 브라우저에서 메일의 링크를 열어 주세요.</p>
          <button id="sendLinkButton" type="submit">로그인 링크 받기</button>
        </form>
        <p class="message" id="authMessage" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="message error" id="emailError" role="alert" aria-live="assertive" aria-atomic="true" hidden></p>
        <p class="hint privacy-note">이 페이지는 학급 명단을 별도로 브라우저에 저장하지 않습니다.</p>
      </div>

      <div id="signedInPanel" hidden>
        <h2>로그인되었습니다</h2>
        <p class="hint">로그인한 이메일</p>
        <p class="logged-in-email" id="userEmail"></p>
        <p class="hint">학급 명단 관리 기능을 준비하고 있습니다.</p>
        <button class="secondary" id="signOutButton" type="button">로그아웃</button>
        <p class="message" id="signedInMessage" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="message error" id="signOutError" role="alert" aria-live="assertive" aria-atomic="true" hidden></p>
        <p class="hint privacy-note">공용 컴퓨터에서는 사용을 마친 뒤 반드시 로그아웃해 주세요.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/supabase-config.js"></script>
  <script src="../shared/supabase-client.js"></script>
  <script src="../shared/auth.js"></script>
  <script>
    (() => {
      const checkingPanel = document.querySelector("#checkingPanel");
      const signedOutPanel = document.querySelector("#signedOutPanel");
      const signedInPanel = document.querySelector("#signedInPanel");
      const magicLinkForm = document.querySelector("#magicLinkForm");
      const emailInput = document.querySelector("#email");
      const sendLinkButton = document.querySelector("#sendLinkButton");
      const authMessage = document.querySelector("#authMessage");
      const emailError = document.querySelector("#emailError");
      const userEmail = document.querySelector("#userEmail");
      const signOutButton = document.querySelector("#signOutButton");
      const signedInMessage = document.querySelector("#signedInMessage");
      const signOutError = document.querySelector("#signOutError");
      const defaultButtonText = "로그인 링크 받기";
      let cooldownSeconds = 0;
      let cooldownTimer = null;
      let isSending = false;

      function clearSignedOutMessages() {
        authMessage.textContent = "";
        emailError.textContent = "";
        emailError.hidden = true;
        emailInput.setAttribute("aria-invalid", "false");
      }

      function showSignedOut() {
        checkingPanel.hidden = true;
        signedInPanel.hidden = true;
        signedOutPanel.hidden = false;
        userEmail.textContent = "";
        signedInMessage.textContent = "";
        signOutError.textContent = "";
        signOutError.hidden = true;
      }

      function showSignedIn(email) {
        checkingPanel.hidden = true;
        signedOutPanel.hidden = true;
        signedInPanel.hidden = false;
        userEmail.textContent = email || "이메일 정보를 확인할 수 없습니다.";
      }

      function showSignedOutError(message) {
        showSignedOut();
        emailError.textContent = message;
        emailError.hidden = false;
      }

      function updateSendButton() {
        if (isSending) {
          sendLinkButton.disabled = true;
          sendLinkButton.textContent = "로그인 링크 보내는 중";
          return;
        }

        if (cooldownSeconds > 0) {
          sendLinkButton.disabled = true;
          sendLinkButton.textContent = `다시 요청 (${cooldownSeconds}초)`;
          return;
        }

        sendLinkButton.disabled = false;
        sendLinkButton.textContent = defaultButtonText;
      }

      function startCooldown() {
        if (cooldownTimer) {
          window.clearInterval(cooldownTimer);
        }

        cooldownSeconds = 60;
        updateSendButton();
        cooldownTimer = window.setInterval(() => {
          cooldownSeconds -= 1;
          updateSendButton();

          if (cooldownSeconds <= 0) {
            window.clearInterval(cooldownTimer);
            cooldownTimer = null;
          }
        }, 1000);
      }

      async function checkCurrentUser() {
        try {
          const user = await window.kwonClassAuth.getCurrentUser();
          if (user) {
            showSignedIn(user.email);
          } else {
            showSignedOut();
          }
        } catch (error) {
          showSignedOutError(error.message);
        }
      }

      magicLinkForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearSignedOutMessages();
        isSending = true;
        updateSendButton();
        authMessage.textContent = "로그인 링크를 보내고 있습니다.";

        try {
          await window.kwonClassAuth.sendMagicLink(emailInput.value);
          authMessage.textContent = "입력한 이메일로 로그인 링크를 보냈습니다. 같은 기기와 브라우저에서 메일의 링크를 열어 주세요.";
          startCooldown();
        } catch (error) {
          emailInput.setAttribute("aria-invalid", "true");
          emailError.textContent = error.message;
          emailError.hidden = false;
          emailInput.focus();
        } finally {
          isSending = false;
          updateSendButton();
        }
      });

      signOutButton.addEventListener("click", async () => {
        signOutError.textContent = "";
        signOutError.hidden = true;
        signedInMessage.textContent = "로그아웃하고 있습니다.";
        signOutButton.disabled = true;

        const result = await window.kwonClassAuth.signOut();
        signOutButton.disabled = false;

        if (result.success) {
          showSignedOut();
          authMessage.textContent = "로그아웃했습니다.";
          emailInput.focus();
          return;
        }

        signedInMessage.textContent = "";
        signOutError.textContent = result.error;
        signOutError.hidden = false;
      });

      try {
        window.kwonClassAuth.onAuthStateChange((event, email) => {
          if (event === "SIGNED_IN" && email) {
            showSignedIn(email);
          }

          if (event === "SIGNED_OUT") {
            showSignedOut();
          }
        });
        checkCurrentUser();
      } catch (error) {
        showSignedOutError(error.message);
      }
    })();
  </script>
</body>
</html>
