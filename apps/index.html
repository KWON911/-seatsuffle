<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권쌤의 교사용 웹앱</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --soft-bg: #f4f8fc;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d9e4ef;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --primary-soft: #eaf2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    a { color: inherit; text-decoration: none; }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .back-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      color: var(--primary-dark);
      font-weight: 800;
    }

    .back-link:hover,
    .back-link:focus-visible { text-decoration: underline; }

    header { margin: 40px 0 28px; }

    h1 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.15;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .app-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--soft-bg);
    }

    h2 { margin: 0 0 8px; font-size: 1.2rem; }

    .app-item p { margin: 0; color: var(--muted); line-height: 1.6; }

    .launch-link {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 16px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
    }

    .launch-link:hover,
    .launch-link:focus-visible { background: var(--primary-dark); outline: none; }

    @media (max-width: 540px) {
      main { width: min(100% - 24px, 680px); padding-top: 20px; }
      header { margin: 28px 0 24px; }
      .app-item { align-items: flex-start; flex-direction: column; gap: 16px; }
      .launch-link { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../">← 권쌤의 교실로 돌아가기</a>
    <header>
      <h1>권쌤의 교사용 웹앱</h1>
      <p class="intro">교실에서 바로 사용할 수 있는 간단한 웹앱을 모았습니다.</p>
    </header>

    <section aria-label="웹앱 목록">
      <ul class="app-list">
        <li class="app-item" data-category="수업 운영">
          <div>
            <h2>발표 순서 정하기</h2>
            <p>학생 이름을 입력해 무작위 발표 순서를 만드는 도구입니다.</p>
          </div>
          <a class="launch-link" href="./presentation-order/">실행하기</a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
